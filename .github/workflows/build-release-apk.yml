name: Build Release APKs

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag del release al que subir los APKs (vacio = ultimo release)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME"/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Build APKs (debug y release firmados con dave.keystore)
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Resolve release tag
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.release.tag_name }}"
          if [ -z "$TAG" ]; then TAG="${{ github.event.inputs.tag }}"; fi
          if [ -z "$TAG" ]; then TAG=$(gh release list --limit 1 --json tagName --jq '.[0].tagName'); fi
          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then echo "No se encontro release objetivo"; exit 1; fi
          echo "TAG=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release objetivo: $TAG"

      - name: Upload app-debug.apk
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ steps.tag.outputs.TAG }}" app/build/outputs/apk/debug/app-debug.apk --clobber

      - name: Upload app-release.apk
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ steps.tag.outputs.TAG }}" app/build/outputs/apk/release/app-release.apk --clobber
