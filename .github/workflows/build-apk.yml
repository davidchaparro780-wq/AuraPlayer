name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Compile & Package APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK with Gradle
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NovaPlayer-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Create GitHub Release (Latest APK)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: NovaPlayer v1.0.0 (Sin Anuncios)
          body: |
            ## 🚀 NovaPlayer v1.0.0
            
            Reproductor multimedia ultra fluido y 100% libre de anuncios para Android.
            
            ### ✨ Características
            - **0 Anuncios, 0 Rastreadores**: Experiencia limpia y privada.
            - **Tasa de refresco fluida de 120 FPS** con Jetpack Compose y Material 3.
            - **Reproducción de Música en Segundo Plano**: Funciona con la pantalla bloqueada y control desde notificaciones.
            - **Reproductor de Video con Picture-in-Picture (PiP)**: Ventana flotante sobre otras apps.
            - **Ecualizador Nativo de 5 bandas** con refuerzo de graves (*Bass Boost*).
            - **Navegación por Carpetas y Búsqueda Instantánea**.
            
            ### 📲 Instalación
            Descarga el archivo `NovaPlayer-debug.apk` adjunto abajo e instálalo directamente en tu teléfono Android.
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
